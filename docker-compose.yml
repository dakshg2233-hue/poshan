version: '3.8'

services:
  poshan:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: poshan-app
    ports:
      - "3000:3000"
    environment:
      # Supabase
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

      # Email (Resend)
      RESEND_API_KEY: ${RESEND_API_KEY}

      # Payments (Razorpay)
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}

      # Site
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_ANALYTICS_ID: ${NEXT_PUBLIC_ANALYTICS_ID}

      # Vision API (Omniroute)
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY}
      OMNIROUTE_BASE_URL: ${OMNIROUTE_BASE_URL}
      OMNIROUTE_VISION_MODEL: ${OMNIROUTE_VISION_MODEL}

      # Node environment
      NODE_ENV: production

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    volumes:
      - /app/node_modules

    networks:
      - poshan-network

  # Optional: PostgreSQL for local development
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: poshan-db
  #   environment:
  #     POSTGRES_USER: ${DB_USER:-poshan}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
  #     POSTGRES_DB: ${DB_NAME:-poshan}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - poshan-network

networks:
  poshan-network:
    driver: bridge

